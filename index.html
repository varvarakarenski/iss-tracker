<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ISS Tracker</title>
        <link rel="icon" type="image/gif" href="static/img/iss.gif">
        <link rel="stylesheet" href="static/css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    </head>

    <body>
        <canvas id="stars"></canvas>
        <div class="content">
            <center><h1>ISS Tracker</h1></center>
            <div class="info">
                <p>ISS Location:</p>
                <p> Latitude: <span id="lat">Loading...</span></p>
                <p> Longitude: <span id="lon">Loading...</span></p>
            </div>
        </div>
        <div id="map">

        </div>
        
        <div class="content">
            <center><h1>More Info</h1></center>
            <div class="info">
                <p> Altitude: <span id="alt">Loading...</span> km</p>
                <p> Velocity: <span id="vel">Loading...</span> km/h</p>
            </div>
        </div>

        <div class="content">
            <center><h1>Current Crew</h1></center>
            <div id="crew"></div>
        </div>
        
        <center><a id="github" href="https://github.com/varvarakarenski/iss-tracker">GitHub</a></center>
        <script src="static/css/script.js"></script>
    </body>
</html>
